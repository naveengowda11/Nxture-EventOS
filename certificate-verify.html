<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>NXTURE Certificate Verification</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f8f6;color:#173a35;display:grid;place-items:center;min-height:100vh}.card{width:min(620px,calc(100% - 32px));background:#fff;border:1px solid #dce9e4;border-radius:22px;padding:34px;box-shadow:0 18px 50px rgba(20,50,45,.1)}h1{margin:8px 0 4px}.eyebrow{color:#16796b;font-size:12px;font-weight:700;letter-spacing:1.4px}.status{padding:10px 14px;border-radius:10px;background:#eef8f4;color:#16796b;display:inline-block;font-weight:700;margin:18px 0}.row{padding:11px 0;border-bottom:1px solid #edf2f0}.label{font-size:11px;color:#7a8985;text-transform:uppercase;letter-spacing:.8px}.value{margin-top:3px;font-weight:600}</style></head><body><main class="card"><div class="eyebrow">NXTURE • PUBLIC VERIFICATION</div><h1>Certificate Verification</h1><div id="result"><p>Checking certificate...</p></div></main><script>const code=new URLSearchParams(location.search).get('code');const result=document.getElementById('result');if(!code){result.innerHTML='<div class="status">Invalid verification link</div>'; }else{fetch('/api/certificates/verify/'+encodeURIComponent(code)).then(r=>r.json()).then(d=>{if(!d.valid){result.innerHTML='<div class="status" style="background:#fff1f0;color:#b42318">Certificate not found</div>';return}const c=d.certificate;result.innerHTML='<div class="status">✓ Certificate is valid</div><div class="row"><div class="label">Student</div><div class="value">'+esc(c.studentName)+'</div></div><div class="row"><div class="label">Student ID</div><div class="value">'+esc(c.studentId||'—')+'</div></div><div class="row"><div class="label">Event</div><div class="value">'+esc(c.eventTitle)+'</div></div><div class="row"><div class="label">Date</div><div class="value">'+esc(c.date||'—')+'</div></div><div class="row"><div class="label">Issued</div><div class="value">'+esc(new Date(c.issuedAt).toLocaleDateString('en-IN'))+'</div></div>';}).catch(()=>result.innerHTML='<div class="status" style="background:#fff1f0;color:#b42318">Unable to verify certificate</div>')}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}</script></body></html>
